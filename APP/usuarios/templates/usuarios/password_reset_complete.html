{% extends 'base_prisma.html' %}
{% load static %}

{% block title %}Contraseña actualizada - Prisma{% endblock %}
{% block body_attrs %} class="auth-page"{% endblock %}

{% block content %}
    <div class="auth-container">
        <div class="auth-form-container">
            <div class="auth-logo"><img src="{% static 'img/logo_prisma.png' %}" alt="Prisma Logo"></div>
            <h2>Contraseña actualizada</h2>
            <p class="auth-subtitle">Ya puedes ingresar con tu nueva contraseña.</p>
            <a href="{% url 'login' %}" class="btn-primary btn-full">Iniciar sesión</a>
        </div>
    </div>
{% endblock %}
