{% extends 'base_admin.html' %}
{% load static %}

{% block content %}

<!-- Vinculación del CSS con versión (?v=1.1) para forzar la recarga de caché -->
<link rel="stylesheet" href="{% static 'css/crear_producto.css' %}?v=1.2">


<main class="crear-container">
    <!-- BOTONES DE NAVEGACIÓN -->
    <div class="acciones-navegacion">
        <a href="{% url 'perfil' %}" class="btn-nav">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Administración</span>
        </a>

        <a href="{% url 'lista_productos' %}" class="btn-nav">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>Productos</span>
        </a>
    </div>

    <!-- FORMULARIO -->
    <form method="POST" enctype="multipart/form-data" novalidate>
        {% csrf_token %}

        <div class="producto-contenido">

            <!-- GALERÍA DE IMÁGENES -->
            <section class="galeria">

                <!-- MINIATURAS (IMÁGENES 2, 3 Y 4) -->
                <div class="miniaturas">

                    <!-- IMAGEN 2 -->
                    <div class="contenedor-miniatura">
                        <button type="button" class="btn-cerrar-imagen" onclick="eliminarImagen('preview2', this)" title="Eliminar imagen">
                            &times;
                        </button>

                        <label class="miniatura">
                            <input type="file" name="imagen_2" accept="image/*" onchange="mostrarImagen(this, 'preview2')">
                            {% if producto_editar and producto_editar.imagen_2 %}
                                <img id="preview2" class="mostrar" src="{{ producto_editar.imagen_2.url }}" alt="Imagen 2">
                            {% else %}
                                <img id="preview2" alt="Imagen 2">
                            {% endif %}
                            <span class="plus">+</span>
                        </label>

                        <input type="hidden" name="eliminar_imagen_2" value="0">
                    </div>

                    <!-- IMAGEN 3 -->
                    <div class="contenedor-miniatura">
                        <button type="button" class="btn-cerrar-imagen" onclick="eliminarImagen('preview3', this)" title="Eliminar imagen">
                            &times;
                        </button>

                        <label class="miniatura">
                            <input type="file" name="imagen_3" accept="image/*" onchange="mostrarImagen(this, 'preview3')">
                            {% if producto_editar and producto_editar.imagen_3 %}
                                <img id="preview3" class="mostrar" src="{{ producto_editar.imagen_3.url }}" alt="Imagen 3">
                            {% else %}
                                <img id="preview3" alt="Imagen 3">
                            {% endif %}
                            <span class="plus">+</span>
                        </label>

                        <input type="hidden" name="eliminar_imagen_3" value="0">
                    </div>

                    <!-- IMAGEN 4 -->
                    <div class="contenedor-miniatura">
                        <button type="button" class="btn-cerrar-imagen" onclick="eliminarImagen('preview4', this)" title="Eliminar imagen">
                            &times;
                        </button>

                        <label class="miniatura">
                            <input type="file" name="imagen_4" accept="image/*" onchange="mostrarImagen(this, 'preview4')">
                            {% if producto_editar and producto_editar.imagen_4 %}
                                <img id="preview4" class="mostrar" src="{{ producto_editar.imagen_4.url }}" alt="Imagen 4">
                            {% else %}
                                <img id="preview4" alt="Imagen 4">
                            {% endif %}
                            <span class="plus">+</span>
                        </label>

                        <input type="hidden" name="eliminar_imagen_4" value="0">
                    </div>

                </div>

                <!-- IMAGEN PRINCIPAL -->
                <div class="principal-contenedor">
                    <button type="button" class="btn-cerrar-imagen" onclick="eliminarImagenPrincipal()" title="Eliminar imagen principal">
                        &times;
                    </button>

                    <label class="imagen-principal">
                        <input type="file" name="imagen_principal" accept="image/*" onchange="mostrarImagenPrincipal(this)">

                        {% if producto_editar and producto_editar.imagen_principal %}
                            <img id="previewPrincipal" class="mostrar" src="{{ producto_editar.imagen_principal.url }}" alt="Imagen principal">
                            <div id="contenidoPrincipal" class="contenido-oculto"></div>
                        {% else %}
                            <img id="previewPrincipal" alt="Imagen principal">
                            <div id="contenidoPrincipal">
                                <span class="plus-grande">+</span>
                                <span class="texto-imagen">Agregar imagen principal </span>
                            </div>
                        {% endif %}
                    </label>

                    <input type="hidden" name="eliminar_imagen_principal" id="eliminarImagenPrincipalInput" value="0">
                </div>

            </section>

            <!-- INFORMACIÓN DEL PRODUCTO -->
            <section class="informacion">

                <!-- NOMBRE -->
                <div class="campo">
                    <label for="nombre">Nombre del producto</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe el nombre del producto" value="{% if producto_editar %}{{ producto_editar.nombre }}{% else %}{{ nombre|default:'' }}{% endif %}">
                </div>

                <!-- PRECIO -->
                <div class="campo precio">
                    <label for="precio">Precio *</label>
                    <div class="precio-input">
                        <span>$</span>
                        <input type="number" id="precio" name="precio" placeholder="0" step="0.01" min="0.01" value="{% if producto_editar %}{{ producto_editar.precio }}{% else %}{{ precio|default:'' }}{% endif %}">
                    </div>
                </div>

                <!-- CATEGORÍA -->
                <div class="campo">
                    <label for="categoria">Categoría *</label>
                    <select id="categoria" name="categoria">
                        <option value="">Selecciona una categoría</option>
                        {% for categoria in categorias %}
                            <option value="{{ categoria.id }}" {% if producto_editar and producto_editar.categoria.id == categoria.id %}selected{% elif categoria_id == categoria.id %}selected{% endif %}>
                                {{ categoria.nombre }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- DESCRIPCIÓN -->
                <div class="campo">
                    <label for="descripcion">Descripción *</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Escribe una descripción del producto">{% if producto_editar %}{{ producto_editar.descripcion }}{% else %}{{ descripcion|default:'' }}{% endif %}</textarea>
                </div>

                <!-- BOTONES -->
                <button type="submit" class="boton-principal">
                    {% if producto_editar %}
                        Guardar cambios
                    {% else %}
                        Crear producto
                    {% endif %}
                </button>

                {% if producto_editar %}
                    <a href="{% url 'lista_productos' %}" class="boton-cancelar">Cancelar edición</a>
                {% endif %}

            </section>

        </div>
    </form>

</main>

<script src="{% static 'js/crear_producto.js' %}"></script>

{% endblock %}
