{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Panel de administración | Prisma{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- CSS del panel de administración -->
    <link rel="stylesheet" href="{% static 'css/admin_panel.css' %}?v=13">
    <link rel="stylesheet" href="{% static 'css/admin_crud.css' %}?v=7">
    <link rel="stylesheet" href="{% static 'css/messages.css' %}?v=1">

    {% block extra_css %}{% endblock %}
</head>

<body class="admin-body">

<!-- IMPORTAR LIBRERÍA SWEETALERT2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Encabezado principal -->
    {% include 'partials/header.html' %}

    
    {% include 'partials/messages.html' %}
    
    <!-- Contenido de cada página -->
    <main class="admin-main">
        {% block content %}
        {% endblock %}
    </main>



    <script src="{% static 'js/admin_messages.js' %}"></script>
    {% block extra_js %}{% endblock %}

</body>

</html>
