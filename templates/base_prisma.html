{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Prisma - El arte del postre{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css">
</head>
<body{% block body_attrs %}{% endblock %}>
{% block content %}{% endblock %}

    <!-- Rutas de Django para la navegación del módulo de experiencia del cliente -->
    <script>
        window.PRISMA = {
            imgBase: "{% static 'img/' %}",
            urls: {
                inicio: "{% url 'base_cliente' %}",
                productos: "{% url 'productos' %}",
                temporada: "{% url 'temporada' %}",
                reservas: "{% url 'reservas' %}",
                contactos: "{% url 'contactos' %}",
                carrito: "{% url 'carrito' %}",
                login: "{% url 'login' %}",
                registro: "{% url 'registro' %}",
                recuperar: "{% url 'recuperar' %}"
            }
        };
    </script>
    {% block scripts %}
        <script src="{% static 'js/modulos/cliente/experiencia/script.js' %}" defer></script>
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js" defer></script>
    <script src="{% static 'js/modulos/ux/selectores.js' %}" defer></script>
    <div id="django-messages" hidden aria-hidden="true">
        {% for message in messages %}
            <span data-tags="{{ message.tags }}">{{ message }}</span>
        {% endfor %}
    </div>
    <script src="{% static 'js/modulos/ux/alertas.js' %}" defer></script>
</body>
</html>
