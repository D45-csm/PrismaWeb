{% load static %}

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">

    <!-- Logo de Prisma -->
    <a class="navbar-brand" href="{% url 'base_cliente' %}">
      <img src="{% static 'img/logo_prisma.png' %}" alt="Logo Prisma">
    </a>

    <!-- Botón del menú para dispositivos móviles -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">

      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menú de navegación -->
    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav">

        <!-- Inicio -->
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'base_cliente' %}">
            Inicio
          </a>
        </li>

        {% if user.is_authenticated %}

        <!-- Usuario autenticado -->
        <li class="nav-item">
          <p class="nav-user">
            Bienvenido, {{ user.username }}
          </p>
        </li>

        <!-- Cerrar sesión -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'logout' %}">
            Cerrar sesión
          </a>
        </li>

        {% else %}

        <!-- Iniciar sesión -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'login' %}">
            Iniciar sesión
          </a>
        </li>

        <!-- Registrarse -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'registro' %}">
            Registrarse
          </a>
        </li>

        {% endif %}

      </ul>

    </div>

  </div>
</nav>
