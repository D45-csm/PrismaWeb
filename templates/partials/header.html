{% load static %}

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">

    <!-- Logo de Prisma -->
    <a class="navbar-brand" href="{% url 'base_cliente' %}">
      <img src="{% static 'img/logo_prisma.png' %}" alt="Logo Prisma">
    </a>

    <!-- Botón del menú para dispositivos móviles -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">

      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menú de navegación -->
    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav">

        <!-- Inicio -->
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'base_cliente' %}">
            Inicio
          </a>
        </li>

        {% if user.is_authenticated %}

        <!-- Usuario autenticado -->
        <li class="nav-item nav-account">
          <details class="nav-account-menu">
            <summary>
              <i class="fa-regular fa-user" aria-hidden="true"></i>
              <span>{{ user.username }}</span>
              <i class="fa-solid fa-chevron-down nav-account-chevron" aria-hidden="true"></i>
            </summary>
            <div class="nav-account-dropdown">
              <p class="nav-account-name">{{ user.get_full_name|default:user.username }}</p>
              <a href="{% url 'editar_perfil' %}">
                <i class="fa-regular fa-id-card" aria-hidden="true"></i>
                Editar perfil
              </a>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">
                  <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
                  Cerrar sesión
                </button>
              </form>
            </div>
          </details>
        </li>

        {% else %}

        <!-- Iniciar sesión -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'login' %}">
            Iniciar sesión
          </a>
        </li>

        <!-- Registrarse -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'registro' %}">
            Registrarse
          </a>
        </li>

        {% endif %}

      </ul>

    </div>

  </div>
</nav>
