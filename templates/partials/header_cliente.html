{% load static %}
<header id="header" class="luxury-header luxury-header--customer{% if active == 'inicio' %} luxury-header--hero{% endif %}">
    <div class="container header-container">
        <a class="logo luxury-logo" href="{% url 'base_cliente' %}" aria-label="Prisma, inicio">
            <img src="{% static 'img/logo_prisma_header.png' %}" alt="Prisma">
        </a>

        {% if active == 'inicio' or catalog_search %}
            <form class="header-search-form{% if catalog_search %} catalog-header-search{% endif %}"
                  action="{% url 'productos' %}" method="get" role="search">
                <label class="sr-only" for="headerProductSearch">Buscar productos</label>
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" id="headerProductSearch" name="q" placeholder="Buscar productos..."
                       value="{% if catalog_search %}{{ search_query }}{% endif %}"
                       maxlength="100" autocomplete="off">
                <button type="submit" aria-label="Buscar productos">
                    <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>
        {% endif %}

        <nav class="nav-menu" id="navMenu" aria-label="Navegación principal">
            <ul>
                <li><a class="{% if active == 'inicio' %}active{% endif %}" href="{% url 'base_cliente' %}"><i class="nav-link-icon nav-icon-home fas fa-house" aria-hidden="true"></i>Inicio</a></li>
                <li><a class="{% if active == 'productos' %}active{% endif %}" href="{% url 'productos' %}"><i class="nav-link-icon nav-icon-products fas fa-cake-candles" aria-hidden="true"></i>Catálogo</a></li>
                <li><a class="{% if active == 'reservas' %}active{% endif %}" href="{% url 'reservas' %}"><i class="nav-link-icon nav-icon-reservations far fa-calendar-check" aria-hidden="true"></i>Reservas</a></li>
                <li><a class="{% if active == 'contactos' %}active{% endif %}" href="{% url 'contactos' %}"><i class="nav-link-icon nav-icon-contact fas fa-comment-dots" aria-hidden="true"></i>Contacto</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="{% url 'carrito' %}" class="btn-cart header-action-btn" aria-label="Ver carrito">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count">0</span>
            </a>
            {% if user.is_authenticated and not user.is_staff and not user.is_superuser %}
                <div class="customer-session-pill">
                    <span class="customer-session-label" title="{{ user.get_full_name|default:user.username }}">{{ user.get_full_name|default:user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="customer-logout-button" title="Cerrar sesión"><i class="fas fa-sign-out-alt"></i></button>
                    </form>
                </div>
            {% else %}
                <a href="{% url 'login' %}" class="btn-login header-action-btn" aria-label="Iniciar sesión" title="Mi Cuenta">
                    <i class="far fa-user"></i>
                </a>
            {% endif %}
        </div>

        <button class="mobile-menu-btn header-action-btn" type="button" aria-label="Abrir menú" aria-expanded="false"
                aria-controls="navMenu" onclick="toggleMobileMenu()">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
    </div>
</header>
